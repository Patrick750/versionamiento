name: Version Bump on Merge

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-bump:
    name: Auto Versioning and Tagging
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore(version-bump)')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Process Commits and Bump Version
        env:
          VERSION_ACTOR: ${{ github.actor }}
        run: |
          python3 scripts/versionamiento.py bump \
            --before "${{ github.event.before }}" \
            --after "${{ github.event.after }}" \
            --push \
            --output-sha-file final_sha.txt

      - name: Upload Versioned Reference Artifact
        uses: actions/upload-artifact@v4
        with:
          name: versioned-reference
          path: final_sha.txt
          if-no-files-found: warn

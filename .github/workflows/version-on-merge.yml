name: Version Bump on Merge

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-bump:
    name: Auto Versioning and Tagging
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore(version-bump)')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Process Commits and Bump Version
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          echo "============================================="
          echo "Automated Versioning Execution"
          echo "Before SHA : $BEFORE"
          echo "After SHA  : $AFTER"
          echo "Branch     : ${{ github.ref_name }}"
          echo "============================================="

          # Determine commit range
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            echo "Initial branch push detected. Reading commits up to $AFTER..."
            COMMITS=$(git rev-list --reverse "$AFTER")
          else
            if git merge-base --is-ancestor "$BEFORE" "$AFTER" 2>/dev/null; then
              COMMITS=$(git rev-list --reverse "${BEFORE}..${AFTER}")
            else
              echo "Warning: $BEFORE is not an ancestor of $AFTER (non-fast-forward / rebase)."
              COMMITS=$(git rev-list --reverse -n 1 "$AFTER")
            fi
          fi

          if [[ -z "${COMMITS:-}" ]]; then
            echo "No commits found in the range. Exiting."
            exit 0
          fi

          # Ensure VERSION file exists with initial 0.0.0
          if [[ ! -f VERSION ]]; then
            echo "0.0.0" > VERSION
            echo "Initialized VERSION file at 0.0.0"
          fi

          BUMP_COUNT=0

          for SHA in $COMMITS; do
            SUBJECT=$(git log -1 --format=%s "$SHA")
            SHORT_SHA=$(git rev-parse --short "$SHA")

            echo ""
            echo "--------------------------------------------------"
            echo "Analyzing commit: $SHORT_SHA - $SUBJECT"

            # Skip commits generated by this versioning bot
            if [[ "$SUBJECT" =~ chore\(version-bump\) ]]; then
              echo "  [SKIP] Detected automated version-bump commit."
              continue
            fi

            # Regex search for keyword (high | low | parch | patch) followed by [X.Y.Z]
            KEYWORD=$(echo "$SUBJECT" | grep -ioP '\b(high|low|parch|patch)(?=\s*\[[0-9]+\.[0-9]+\.[0-9]+\])' | head -n 1 | tr '[:upper:]' '[:lower:]' || true)

            if [[ -z "$KEYWORD" ]]; then
              echo "  [SKIP] No versioning keyword found. Skipping commit."
              continue
            fi

            echo "  [FOUND] Keyword detected: '$KEYWORD'"

            # Read and sanitize current VERSION
            CURRENT_VERSION=$(tr -d '[:space:]' < VERSION)
            echo "  Current version: $CURRENT_VERSION"

            # Validate SemVer format (MAJOR.MINOR.PATCH)
            if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid version format in VERSION file: '$CURRENT_VERSION'. Expected MAJOR.MINOR.PATCH (e.g. 1.2.3)" >&2
              exit 1
            fi

            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

            case "$KEYWORD" in
              high)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              low)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              parch|patch)
                PATCH=$((PATCH + 1))
                ;;
              *)
                echo "  [SKIP] Unknown keyword '$KEYWORD'."
                continue
                ;;
            esac

            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "  New calculated version: $NEW_VERSION"

            # Update VERSION file
            echo "$NEW_VERSION" > VERSION
            git add VERSION

            # Create version commit and annotated tag
            COMMIT_MSG="chore(version-bump): $NEW_VERSION (origen: $SHORT_SHA - $SUBJECT)"
            TAG_NAME="v$NEW_VERSION"
            TAG_MSG="Release $TAG_NAME (origen: $SHORT_SHA - $SUBJECT)"

            git commit -m "$COMMIT_MSG"

            if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
              echo "  [WARN] Tag $TAG_NAME already exists, skipping tag creation."
            else
              git tag -a "$TAG_NAME" -m "$TAG_MSG"
              echo "  [TAG] Created annotated tag $TAG_NAME"
            fi

            BUMP_COUNT=$((BUMP_COUNT + 1))
          done

          echo ""
          echo "============================================="
          echo "Summary: $BUMP_COUNT version bump(s) performed."
          echo "============================================="

          if [ "$BUMP_COUNT" -gt 0 ]; then
            echo "Pushing commits and tags to origin..."
            git push origin "HEAD:${{ github.ref_name }}"
            git push origin --tags
            echo "Push completed successfully."
          else
            echo "No commits required version bumping. Nothing pushed."
          fi

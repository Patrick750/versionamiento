name: Lint PR Commits

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - master

jobs:
  lint-commits:
    name: Validate PR Commit Format & Coherence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR commits
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Test Suite
        run: |
          python3 -m unittest discover -s tests -p 'test_versionamiento.py'

      - name: Check Synchronized Version Files
        run: |
          python3 scripts/versionamiento.py check

      - name: Validate Commit Formats and SemVer Coherence
        run: |
          python3 scripts/versionamiento.py lint \
            --before "${{ github.event.pull_request.base.sha }}" \
            --after "${{ github.event.pull_request.head.sha }}"
